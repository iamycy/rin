[workspace]
name = "rin-pitch"
description = "Relative Interval Network (RIN) pitch smoothing: fuse absolute F0 estimates with multi-hop VQT relative pitch differences through a network-flow LP"
authors = ["Chin-Yun Yu <chin-yun.yu@qmul.ac.uk>", "Chi-Jen Peng"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"
pip = "*"
numpy = ">=2"
scipy = "*"
librosa = "*"

[pypi-dependencies]
rin-pitch = { path = ".", editable = true }

# Split from `dev` so the per-Python environments below can carry the test
# runner without the tooling: numpydoc >=1.11 requires Python >=3.11, which
# would make a 3.10 environment unsolvable.
[feature.test.dependencies]
pytest = "*"
pytest-cov = ">=7.1.0, <8"

[feature.dev.dependencies]
ruff = "*"
python-build = "*"
numpydoc = ">=1.11.0,<2"

# One feature per supported interpreter, so CI can run the suite across the
# whole `requires-python` range instead of whatever the solver happens to pick.
[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[environments]
default = ["test", "dev"]
py310 = ["py310", "test"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]

[tasks]
test = { cmd = "pytest -v", description = "Run the test suite" }
lint = { cmd = "ruff check src tests", description = "Lint with ruff" }
docstrings = { cmd = "python -m numpydoc lint src/rin/*.py", description = "Validate public docstrings against numpydoc" }
format = { cmd = "ruff format src tests", description = "Format with ruff" }
build = { cmd = "python -m build", description = "Build sdist and wheel" }
smoke = { cmd = "python scripts/smoke_wheel.py", description = "Install the built wheel in a clean venv and check its version wiring" }
