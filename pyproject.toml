[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rin-pitch"
dynamic = ["version"]
description = "Relative Interval Network (RIN) pitch smoothing: fuse absolute F0 estimates with multi-hop VQT relative pitch differences through a network-flow LP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chin-Yun Yu", email = "chin-yun.yu@qmul.ac.uk" },
    { name = "Chi-Jen Peng" },
]
maintainers = [{ name = "Chin-Yun Yu", email = "chin-yun.yu@qmul.ac.uk" }]
keywords = ["pitch-tracking", "f0-estimation", "vqt", "network-flow", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Floors are the oldest releases that work with NumPy 2, which
# `np.linalg.vecdot` in relative.py already requires: SciPy 1.12 caps
# `numpy<1.29` and 1.13 is the first to allow 2.x, and librosa 0.10.1
# fails to import while 0.10.2 runs clean.
dependencies = ["numpy>=2", "scipy>=1.13", "librosa>=0.10.2"]

[project.urls]
Homepage = "https://github.com/iamycy/rin"
Repository = "https://github.com/iamycy/rin"

# The git tag is the single source of truth for the installed version:
# `git tag v1.1.0`, and hatch-vcs derives it at build time. conda-recipe/
# meta.yaml carries the only hand-written version, and only until submission.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/rin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `pixi run test` passes a bare `--cov`, so the scope lives here. Without the
# omit, pytest-cov also measures `tests/` and reports the suite's own coverage
# to Codecov. Do not set `source` instead: it rewrites the XML filenames to
# bare basenames under a `src/rin` prefix, and Codecov then fails to match them
# against the repo. relative_files keeps paths checkout-independent so the
# Linux, macOS and Windows legs all report identical filenames.
[tool.coverage.run]
omit = ["tests/*"]
relative_files = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["D", "E", "F", "W", "I", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test functions are named to describe themselves; docstrings would restate them.
"tests/*" = ["D"]

# Public API only: private helpers carry a one-line summary by design.
# EX01/SA01/ES01 are optional numpydoc sections this package does not use.
[tool.numpydoc_validation]
checks = ["all", "EX01", "SA01", "ES01"]
exclude = ['(^|\.)_[^_]']
