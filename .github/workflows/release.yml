name: Release

# Publish to PyPI on version tags, e.g. v1.0.0.
# The tag IS the version: hatch-vcs derives it from `git describe`, so nothing
# in the repo declares one. fetch-depth: 0 below is required -- a shallow
# checkout has no tags and would publish a 0.0.0 release.
# First release: create a pending trusted publisher for the `rin-pitch`
# project at https://pypi.org/manage/project/rin-pitch/settings/publishing/
# pointing at this repo before pushing the tag.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
      - run: pixi run lint
      - run: pixi run test
      - run: pixi run build
      - uses: pypa/gh-action-pypi-publish@release/v1
