name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint and docstrings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          # fail if pixi.lock is out of sync with pixi.toml
          locked: true
      - run: pixi run lint
      - run: pixi run docstrings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.env }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        env: [py310, py311, py312, py313]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          environments: ${{ matrix.env }}
          locked: true
      - run: pixi run -e ${{ matrix.env }} test

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          locked: true
      - run: pixi run build
      - name: install the wheel and check the resolved version
        run: pixi run smoke
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
